<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошарик: Покорми кота</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: Arial, sans-serif; padding-top: 50px; }
        button { background: #ffcc00; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <h1>🐾 Кормежка Кошарика</h1>
    <p>Марио ждет вкусняшку!</p>
    <h2 id="score">Сытость: 0</h2>
    <button onclick="feedCat()">Покормить 🐟</button>

    <script>
        let score = 0;
        function feedCat() {
            score += 1;
            document.getElementById('score').innerText = 'Сытость: ' + score;
        }
    </script>
</body>
</html>
