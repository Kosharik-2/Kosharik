<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кошарик</title>
<style>
body{background:#1a1a1a;color:#fff;text-align:center;font-family:Arial;padding-top:40px}
button{background:#ffcc00;border:none;padding:15px 30px;font-size:18px;font-weight:bold;border-radius:10px;margin:10px;cursor:pointer}
button:active{transform:scale(0.95)}
.shop{background:#2a2a2a;padding:15px;border-radius:10px;display:inline-block;margin-top:20px}
.buy{background:#4CAF50;color:#fff;padding:10px 20px;font-size:14px}
</style>
</head>
<body>
<h1>🐾 Кошарик</h1>
<h2 id="s">Сытость: 0</h2>
<h3 id="p">Сила клика: 1</h3>
<button onclick="feed()">Покормить 🐟</button>

<div class="shop">
<h3>🛒 Магазин</h3>
<p>Вкусный корм (+1): <span id="c">15</span> сытости</p>
<button class="buy" onclick="buy()">Купить</button>
</div>

<script>
let s = parseInt(localStorage.getItem('catScore')) || 0;
let p = parseInt(localStorage.getItem('catPower')) || 1;
let c = parseInt(localStorage.getItem('catCost')) || 15;
upd();

function feed(){
    s += p;
    save();
    upd();
}

function buy(){
    if(s >= c){
        s -= c;
        p += 1;
        c = Math.round(c * 1.5);
        save();
        upd();
    } else {
        alert('Мало сытости!');
    }
}

function save(){
    localStorage.setItem('catScore', s);
    localStorage.setItem('catPower', p);
    localStorage.setItem('catCost', c);
}

function upd(){
    document.getElementById('s').innerText = 'Сытость: ' + s;
    document.getElementById('p').innerText = 'Сила клика: ' + p;
    document.getElementById('c').innerText = c;
}
</script>
</body>
</html>
