<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кошарик: Кликер</title>
<style>
body {
    background: #1a1a1a;
    color: #fff;
    text-align: center;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    user-select: none;
    -webkit-user-select: none;
}
.game-container {
    max-width: 400px;
    margin: 0 auto;
    background: #2a2a2a;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.stats {
    font-size: 16px;
    margin-bottom: 15px;
    background: #333;
    padding: 10px;
    border-radius: 8px;
}
.cat-box {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 20px auto;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #ffcc00;
    cursor: pointer;
    touch-action: none;
}
.cat-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
}
.message {
    font-size: 18px;
    font-weight: bold;
    color: #ffcc00;
    height: 24px;
    margin: 10px 0;
}
button {
    background: #ffcc00;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 8px;
    margin: 5px;
    cursor: pointer;
}
button:active { transform: scale(0.95); }
.shop-section {
    background: #333;
    padding: 10px;
    border-radius: 10px;
    margin-top: 15px;
    text-align: left;
}
.shop-section h3 { margin: 0 0 10px 0; font-size: 16px; text-align: center; color: #ffcc00; }
.item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 14px;
}
.buy-btn { background: #4CAF50; color: #fff; padding: 6px 12px; font-size: 12px; }
</style>
</head>
<body id="bodyBg">

<div class="game-container">
    <h1>🐾 Кошарик</h1>
    
    <div class="stats">
        <div>🐟 Сытость: <span id="s">0</span></div>
        <div>💵 Деньги: <span id="m">0</span></div>
        <div>💪 Сила поглаживания: <span id="p">1</span></div>
    </div>

    <div class="message" id="msg">Проведи пальцем, чтобы погладить!</div>

    <!-- Твой кошарик[span_1](start_span)[span_1](end_span) -->
    <div class="cat-box" id="catBox">
        <img id="catImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' background='%23444'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='60'>🐱</text></svg>" alt="Кошарик">
    </div>

    <button onclick="getMoney()">📺 Взять деньги у спонсоров (+10)</button>

    <div class="shop-section">
        <h3>🛒 Магазин еды</h3>
        <div class="item-row">
            <span>Вкусный корм (+1 сила)</span>
            <button class="buy-btn" onclick="buyFood()">Купить (<span id="c">15</span>д)</button>
        </div>
    </div>

    <div class="shop-section">
        <h3>👕 Костюмы кошарика</h3>
        <div class="item-row">
            <span>Обычный лук</span>
            <button class="buy-btn" onclick="setCostume('default')">Надеть</button>
        </div>
        <div class="item-row">
            <span>Шляпа джентльмена 🎩</span>
            <button class="buy-btn" onclick="setCostume('hat')">Надеть</button>
        </div>
    </div>

    <div class="shop-section">
        <h3>🏡 Локации</h3>
        <div class="item-row">
            <span>Ковер (родной)[span_2](start_span)[span_2](end_span)</span>
            <button class="buy-btn" onclick="setLocation('carpet')">Выбрать</button>
        </div>
        <div class="item-row">
            <span>Элитный диван (50д)</span>
            <button class="buy-btn" onclick="setLocation('sofa')">Купить</button>
        </div>
    </div>
</div>

<script>
// Состояние игры
let score = parseInt(localStorage.getItem('catScore')) || 0;
let money = parseInt(localStorage.getItem('catMoney')) || 0;
let power = parseInt(localStorage.getItem('catPower')) || 1;
let cost = parseInt(localStorage.getItem('catCost')) || 15;
let currentLoc = localStorage.getItem('catLoc') || 'carpet';
let currentCostume = localStorage.getItem('catCostume') || 'default';

// Ссылки на фото (реальное фото кошарика[span_3](start_span)[span_3](end_span))
const realCatPhoto = "1000020702.jpg"; 

updateUI();

// Обработка свайпов (поглаживание) и тапов (удар)
let startX = 0, startY = 0;
const catBox = document.getElementById('catBox');
const msg = document.getElementById('msg');

catBox.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
});

catBox.addEventListener('touchend', (e) => {
    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;
    let dist = Math.hypot(endX - startX, endY - startY);

    if (dist > 40) {
        // Свайп — погладили!
        score += power;
        money += Math.floor(power / 2) + 1;
        save();
        updateUI();
        msg.innerText = "Муррр... 🐾✨";
        setTimeout(() => { msg.innerText = ""; }, 1200);
    } else {
        // Обычный тап — «ударил» кота
        msg.innerText = "ШШШ! Злой кошарик! 😾";
        setTimeout(() => { msg.innerText = ""; }, 1200);
    }
});

// Для удобства на компьютере (клик по коту — шипит, а для фарма пусть спонсоры или кнопка поглаживания)
catBox.addEventListener('click', (e) => {
    // Если на ПК, клик тоже засчитаем как поглаживание если через пробел, либо просто шипение
    msg.innerText = "ШШШ! Не бей кота! 😾";
    setTimeout(() => { msg.innerText = ""; }, 1200);
});

function getMoney() {
    money += 10;
    save();
    updateUI();
    msg.innerText = "+10 денег от спонсоров! 💵";
    setTimeout(() => { msg.innerText = ""; }, 1200);
}

function buyFood() {
    if (money >= cost) {
        money -= cost;
        power += 1;
        cost = Math.round(cost * 1.5);
        save();
        updateUI();
        msg.innerText = "Ням-ням! Корм куплен 🐟";
        setTimeout(() => { msg.innerText = ""; }, 1200);
    } else {
        msg.innerText = "Не хватает денег! ✖️";
        setTimeout(() => { msg.innerText = ""; }, 1200);
    }
}

function setCostume(type) {
    currentCostume = type;
    save();
    updateUI();
    msg.innerText = "Костюм изменен! 👔";
    setTimeout(() => { msg.innerText = ""; }, 1200);
}

function setLocation(loc) {
    if (loc === 'sofa') {
        let sofaCost = 50;
        if (money >= sofaCost || localStorage.getItem('sofaUnlocked') === 'true') {
            if (localStorage.getItem('sofaUnlocked') !== 'true') {
                money -= sofaCost;
                localStorage.setItem('sofaUnlocked', 'true');
            }
            currentLoc = 'sofa';
        } else {
            msg.innerText = "Диван стоит 50 денег! 🛋️";
            setTimeout(() => { msg.innerText = ""; }, 1200);
            return;
        }
    } else {
        currentLoc = 'carpet';
    }
    save();
    updateUI();
    msg.innerText = "Локация обновлена! 🏡";
    setTimeout(() => { msg.innerText = ""; }, 1200);
}

function save() {
    localStorage.setItem('catScore', score);
    localStorage.setItem('catMoney', money);
    localStorage.setItem('catPower', power);
    localStorage.setItem('catCost', cost);
    localStorage.setItem('catLoc', currentLoc);
    localStorage.setItem('catCostume', currentCostume);
}

function updateUI() {
    document.getElementById('s').innerText = score;
    document.getElementById('m').innerText = money;
    document.getElementById('p').innerText = power;
    document.getElementById('c').innerText = cost;

    // Смена фона в зависимости от локации
    if (currentLoc === 'sofa') {
        document.getElementById('bodyBg').style.background = '#362214'; // цвет дивана/комнаты
    } else {
        document.getElementById('bodyBg').style.background = '#1a1a1a'; // родной ковер[span_4](start_span)[span_4](end_span)
    }

    // Отображение кота с учетом костюма
    let catImgEl = document.getElementById('catImg');
    // Используем реальную фотографию кота[span_5](start_span)[span_5](end_span)
    let baseImg = realCatPhoto; 
    
    if (currentCostume === 'hat') {
        catImgEl.src = baseImg; // Здесь можно кастомизировать под шляпу
        catImgEl.style.filter = "hue-rotate(30deg)"; // легкий эффект шляпы
    } else {
        catImgEl.src = baseImg;
        catImgEl.style.filter = "none";
    }
}
</script>
</body>
</html>
