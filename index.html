<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кошарик: Кликер</title>
<!-- Скрипт рекламной сети AdsGram -->
<script src="https://sad.adsgram.ai/js/sad.js"></script>
<style>
body {
    background: #1a1a1a;
    color: #fff;
    text-align: center;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    user-select: none;
    -webkit-user-select: none;
}
.game-container {
    max-width: 400px;
    margin: 0 auto;
    background: #2a2a2a;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.stats {
    font-size: 16px;
    margin-bottom: 15px;
    background: #333;
    padding: 10px;
    border-radius: 8px;
}
.cat-box {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 20px auto;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #ffcc00;
    cursor: pointer;
    touch-action: none;
}
.cat-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
}
.message {
    font-size: 16px;
    font-weight: bold;
    color: #ffcc00;
    min-height: 28px;
    margin: 10px 0;
}
button {
    background: #ffcc00;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 8px;
    margin: 5px;
    cursor: pointer;
}
button:active { transform: scale(0.95); }
.ad-btn { background: #ff9800; color: #fff; }
.roulette-btn { background: #9c27b0; color: #fff; width: 100%; margin-top: 10px; }
.shop-section {
    background: #333;
    padding: 10px;
    border-radius: 10px;
    margin-top: 15px;
    text-align: left;
}
.shop-section h3 { margin: 0 0 10px 0; font-size: 16px; text-align: center; color: #ffcc00; }
.item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 14px;
}
.buy-btn { background: #4CAF50; color: #fff; padding: 6px 12px; font-size: 12px; }
.buy-btn.active { background: #2196F3; }
</style>
</head>
<body id="bodyBg">

<div class="game-container">
    <h1>🐾 Кошарик</h1>
    
    <div class="stats">
        <div>🐟 Сытость: <span id="s">79</span></div>
        <div>💵 Деньги: <span id="m">0</span></div>
        <div>💪 Сила поглаживания: <span id="p">1</span></div>
    </div>

    <div class="message" id="msg">Проведи пальцем по коту!</div>

    <!-- Картинка кота -->
    <div class="cat-box" id="catBox">
        <img id="catImg" src="1000020704.jpg" alt="Кошарик" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'200\'><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'60\'>🐱</text></svg>'">
    </div>

    <button onclick="getMoney()">💼 Взять у спонсоров (+10)</button>
    <button class="ad-btn" onclick="watchAd()">📺 Смотреть рекламу (+30)</button>
    <button class="roulette-btn" onclick="spinRoulette()">🎰 Крутить рулетку (Бесплатно)</button>

    <div class="shop-section">
        <h3>🛒 Магазин еды</h3>
        <div class="item-row">
            <span>Вкусный корм (+1 сила)</span>
            <button class="buy-btn" onclick="buyFood()">Купить (<span id="c">15</span>д)</button>
        </div>
    </div>

    <div class="shop-section">
        <h3>👑 Гардероб котика</h3>
        <div class="item-row">
            <span>Обычный вид</span>
            <button class="buy-btn" id="btn-none" onclick="setOutfit('none')">Надеть</button>
        </div>
        <div class="item-row">
            <span>Шляпка сэра</span>
            <button class="buy-btn" id="btn-hat" onclick="setOutfit('hat')">Купить (100д)</button>
        </div>
    </div>

    <div class="shop-section">
        <h3>🏡 Локации</h3>
        <div class="item-row">
            <span>Ковер (родной)</span>
            <button class="buy-btn" id="loc-carpet" onclick="setLocation('carpet')">Выбрать</button>
        </div>
        <div class="item-row">
            <span>Элитный диван (50д)</span>
            <button class="buy-btn" id="loc-sofa" onclick="setLocation('sofa')">Купить</button>
        </div>
    </div>
</div>

<script>
const adController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" }) : null;

let score = parseInt(localStorage.getItem('catScore')) || 79;
let money = parseInt(localStorage.getItem('catMoney')) || 0;
let power = parseInt(localStorage.getItem('catPower')) || 1;
let cost = parseInt(localStorage.getItem('catCost')) || 15;
let currentLoc = localStorage.getItem('catLoc') || 'carpet';
let currentOutfit = localStorage.getItem('catOutfit') || 'none';

updateUI();

let startX = 0, startY = 0;
const catBox = document.getElementById('catBox');
const msg = document.getElementById('msg');

catBox.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
});

catBox.addEventListener('touchend', (e) => {
    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;
    let dist = Math.hypot(endX - startX, endY - startY);

    if (dist > 30) {
        score += power;
        money += Math.floor(power / 2) + 1;
        save();
        updateUI();
        msg.innerText = "Муррр... 🐾✨";
        setTimeout(() => { msg.innerText = ""; }, 1000);
    } else {
        msg.innerText = "ШШШ! Не бей! 😾";
        setTimeout(() => { msg.innerText = ""; }, 1000);
    }
});

catBox.addEventListener('click', () => {
    msg.innerText = "ШШШ! 😾";
    setTimeout(() => { msg.innerText = ""; }, 1000);
});

function getMoney() {
    money += 10;
    save();
    updateUI();
    msg.innerText = "+10 от спонсоров! 💵";
    setTimeout(() => { msg.innerText = ""; }, 1000);
}

function watchAd() {
    if (adController) {
        adController.show()
            .then((result) => {
                money += 30;
                save();
                updateUI();
                msg.innerText = "+30 денег за просмотр рекламы! 🎉";
                setTimeout(() => { msg.innerText = ""; }, 1200);
            })
            .catch((err) => {
                msg.innerText = "Реклама не была досмотрена ✖️";
                setTimeout(() => { msg.innerText = ""; }, 1200);
            });
    } else {
        money += 30;
        save();
        updateUI();
        msg.innerText = "+30 денег (тест)! 💵";
        setTimeout(() => { msg.innerText = ""; }, 1200);
    }
}

// ЛОГИКА РУЛЕТКИ
function spinRoulette() {
    const prizes = [
        () => {
            let winMoney = Math.floor(Math.random() * 21) + 10; // от 10 до 30
            money += winMoney;
            msg.innerText = `🎁 В рулетке: +${winMoney} монет!`;
        },
        () => {
            msg.innerText = `🎁 В рулетке: Бонусный ход! Крути еще раз!`;
            // Можно нажать повторно без ожидания, даем еще денег для радости
            money += 5;
        },
        () => {
            power += 1;
            msg.innerText = `🎁 В рулетке: Бесплатный корм! Сила +1 🐟`;
        },
        () => {
            localStorage.setItem('hatUnlocked', 'true');
            currentOutfit = 'hat';
            msg.innerText = `🎁 В рулетке: Выиграна Шляпка сэра! 👑`;
        },
        () => {
            const tips = [
                "Совет от Кота: Чаще гладь кота — полнеет сытость!",
                "Совет от Кота: Копи деньги на элитный диван!",
                "Совет от Кота: Реклама у спонсоров дает легкие деньги.",
                "Совет от Кота: Сон — лучшая игра перед кликом."
            ];
            let randomTip = tips[Math.floor(Math.random() * tips.length)];
            msg.innerText = randomTip;
        }
    ];

    // Выбираем случайный приз
    let randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
    randomPrize();
    save();
    updateUI();
    setTimeout(() => { msg.innerText = ""; }, 4000); // Совет держим чуть дольше на экране
}

function buyFood() {
    if (money >= cost) {
        money -= cost;
        power += 1;
        cost = Math.round(cost * 1.5);
        save();
        updateUI();
        msg.innerText = "Ням-ням! Корм куплен 🐟";
        setTimeout(() => { msg.innerText = ""; }, 1000);
    } else {
        msg.innerText = "Мало денег! ✖️";
        setTimeout(() => { msg.innerText = ""; }, 1000);
    }
}

function setOutfit(outfit) {
    if (outfit === 'hat') {
        let hatCost = 100;
        if (money >= hatCost || localStorage.getItem('hatUnlocked') === 'true') {
            if (localStorage.getItem('hatUnlocked') !== 'true') {
                money -= hatCost;
                localStorage.setItem('hatUnlocked', 'true');
            }
            currentOutfit = 'hat';
            msg.innerText = "Шляпа надета! 🎩";
        } else {
            msg.innerText = "Шляпа стоит 100 денег! 🎩";
            setTimeout(() => { msg.innerText = ""; }, 1000);
            return;
        }
    } else {
        currentOutfit = 'none';
        msg.innerText = "Обычный вид 🐱";
    }
    save();
    updateUI();
    setTimeout(() => { msg.innerText = ""; }, 1000);
}

function setLocation(loc) {
    if (loc === 'sofa') {
        let sofaCost = 50;
        if (money >= sofaCost || localStorage.getItem('sofaUnlocked') === 'true') {
            if (localStorage.getItem('sofaUnlocked') !== 'true') {
                money -= sofaCost;
                localStorage.setItem('sofaUnlocked', 'true');
            }
            currentLoc = 'sofa';
        } else {
            msg.innerText = "Диван стоит 50 денег! 🛋️";
            setTimeout(() => { msg.innerText = ""; }, 1000);
            return;
        }
    } else {
        currentLoc = 'carpet';
    }
    save();
    updateUI();
    msg.innerText = "Локация обновлена! 🏡";
    setTimeout(() => { msg.innerText = ""; }, 1000);
}

function save() {
    localStorage.setItem('catScore', score);
    localStorage.setItem('catMoney', money);
    localStorage.setItem('catPower', power);
    localStorage.setItem('catCost', cost);
    localStorage.setItem('catLoc', currentLoc);
    localStorage.setItem('catOutfit', currentOutfit);
}

function updateUI() {
    document.getElementById('s').innerText = score;
    document.getElementById('m').innerText = money;
    document.getElementById('p').innerText = power;
    document.getElementById('c').innerText = cost;

    if (currentLoc === 'sofa') {
        document.getElementById('bodyBg').style.background = '#362214';
        document.getElementById('loc-sofa').innerText = 'Выбрано';
        document.getElementById('loc-sofa').classList.add('active');
        document.getElementById('loc-carpet').innerText = 'Выбрать';
        document.getElementById('loc-carpet').classList.remove('active');
    } else {
        document.getElementById('bodyBg').style.background = '#1a1a1a';
        document.getElementById('loc-carpet').innerText = 'Выбрано';
        document.getElementById('loc-carpet').classList.add('active');
        document.getElementById('loc-sofa').innerText = localStorage.getItem('sofaUnlocked') === 'true' ? 'Выбрать' : 'Купить';
        document.getElementById('loc-sofa').classList.remove('active');
    }

    if (currentOutfit === 'hat') {
        document.getElementById('btn-hat').innerText = 'Надето';
        document.getElementById('btn-hat').classList.add('active');
        document.getElementById('btn-none').innerText = 'Надеть';
        document.getElementById('btn-none').classList.remove('active');
    } else {
        document.getElementById('btn-none').innerText = 'Надето';
        document.getElementById('btn-none').classList.add('active');
        document.getElementById('btn-hat').innerText = localStorage.getItem('hatUnlocked') === 'true' ? 'Надеть' : 'Купить (100д)';
        document.getElementById('btn-hat').classList.remove('active');
    }
}
</script>
</body>
</html>
